<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>

    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-50 dark:bg-gray-900">

    <!-- NAVBAR -->
    <nav class="bg-white dark:bg-gray-900 border-gray-200">
        <div class="max-w-screen-xl mx-auto flex flex-wrap items-center justify-between p-4">

            <span class="text-2xl font-bold dark:text-white">
                Mi Sitio
            </span>

            <button id="menu-btn" class="md:hidden text-xl">
                ☰
            </button>

            <div id="mobile-menu" class="hidden w-full md:block md:w-auto">
                <ul class="flex flex-col md:flex-row gap-4 p-4 md:p-0 dark:text-white">
                    <li><a href="#">Inicio</a></li>
                    <li><a href="#">Servicios</a></li>
                    <li><a href="#">Portafolio</a></li>
                    <li><a href="#">Contacto</a></li>
                </ul>
            </div>

        </div>
    </nav>

    <!-- HERO -->
    <section class="text-center py-20 px-4">

        <h1 class="text-4xl font-bold dark:text-white">
            Tu presencia digital comienza aquí
        </h1>

        <p class="mt-4 text-gray-600 dark:text-gray-300 max-w-2xl mx-auto">
            Creamos experiencias web modernas con Tailwind CSS.
        </p>

        <button id="start"
            class="mt-6 bg-blue-600 text-white px-6 py-3 rounded-lg">
            Comenzar
        </button>

    </section>

    <!-- TOAST -->
    <div id="toast-interactive"
        class="hidden fixed bottom-5 right-5 bg-white dark:bg-gray-800 p-4 rounded shadow">

        <p class="font-bold dark:text-white">Suscríbete</p>

        <button id="close-toast" class="text-red-500 mt-2">
            Cerrar
        </button>

    </div>

    <!-- CATEGORÍAS -->
    <!-- CATEGORÍAS -->
<section class="py-10">

    <h2 class="text-center text-2xl font-bold mb-4 dark:text-white">
        Categorías
    </h2>

    <div class="max-w-md mx-auto px-2">

        <select id="categories"
            class="w-full p-2 border rounded dark:bg-gray-700 dark:text-white">

            <option selected disabled>
                Seleccione una categoría
            </option>

        </select>

    </div>

</section>

    <!-- PRODUCTOS -->
    <!-- PRODUCTOS -->
<section class="py-10">

    <h2 class="text-center text-2xl font-bold mb-6 dark:text-white">
        Productos
    </h2>

    <div id="products-container"
        class="grid grid-cols-1 md:grid-cols-3 gap-4 max-w-6xl mx-auto p-4">

        <!-- skeleton (con pequeño error visual) -->
        <div class="bg-white p-4 shadow animate-pulse"></div>
        <div class="bg-white p-4 rounded shadow animate-pulse"></div>
        <div class="bg-white p-4 rounded shadow animate-pulse"></div>

    </div>

    <!-- VOTACIÓN -->
<section class="bg-slate-50 dark:bg-gray-900 py-10">

    <div class="flex flex-col items-center justify-center bg-white dark:bg-gray-800 py-8">

        <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-md w-full max-w-md">

            <h2 class="text-2xl font-bold mb-6 text-center text-gray-800 dark:text-white">
                Vota por tu producto preferido
            </h2>

            <div class="mb-6">

                <form id="form_voting" class="relative flex items-center">

                    <select id="select_product"
                        class="block appearance-none w-full bg-white border border-gray-300 text-gray-700 py-3 px-4 pr-8 rounded-lg leading-tight focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">

                        <option value="" disabled selected>
                            Seleccione un producto
                        </option>

                        <option value="product1">
                            Producto 1
                        </option>

                        <option value="product2">
                            Producto 2
                        </option>

                        <option value="product3">
                            Producto 3
                        </option>

                    </select>

                    <button
                        class="ml-4 bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-6 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">

                        VOTAR

                    </button>

                </form>

            </div>

            <div id="results"
                class="border border-gray-300 rounded-lg h-52 w-full p-2 bg-gray-50 dark:bg-gray-700">

                <p class="text-gray-500 text-center mt-16 dark:text-gray-300">
                    Resultado de la votación
                </p>

            </div>

        </div>

    </div>

</section>

</section>

    <!-- JS -->
    <script type="module" src="./js/file01.js"></script>

</body>

</html>
