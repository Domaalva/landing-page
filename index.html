<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>landing-page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
<body>
    <nav class="bg-white border-gray-200 dark:bg-gray-900">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
            <a href="#" class="flex items-center space-x-3">
                <span class="self-center text-2xl font-semibold whitespace-nowrap dark:text-white">
                Mi Sitio
               </span>
            </a>
            <button
            type="button"
            class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none">
            ☰
            </button>

            <div class="hidden w-full md:block md:w-auto">
                <ul class="font-medium flex flex-col p-4 md:p-0 mt-4 border rounded-lg bg-gray-50 md:flex-row md:space-x-8 md:mt-0 md:border-0 md:bg-white dark:text-white">
                <li><a href="#" class="block py-2 px-3">Inicio</a></li>
                <li><a href="#" class="block py-2 px-3">Servicios</a></li>
                <li><a href="#" class="block py-2 px-3">Portafolio</a></li>
                <li><a href="#" class="block py-2 px-3">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="bg-slate-50 dark:bg-gray-900">
        <div id="container-01" class="mx-auto px-4 py-20 text-center">
            <h1 class="text-4xl font-extrabold tracking-tight text-gray-900 dark:text-white">
                Tu presencia digital comienza aquí
            </h1>
            <p class="mt-6 text-lg leading-relaxed text-gray-600 max-w-2xl mx-auto dark:text-gray-300">
                Creamos experiencias web atractivas y rápidas con Tailwind CSS 4.1.
                Dale vida a tus ideas con un diseño moderno y responsivo.
            </p>
            <div id="container-02" class="mt-8 flex justify-center gap-4">
                <button id="start" class="inline-block px-6 py-3 text-white bg-blue-600 rounded-lg dark:border-gray-600 dark:text-white">
                    Comenzar
                </button> 
                <button id="demo" class="inline-block px-6 py-3 border border-gray-300 text-gray-700 rounded-lg">Ver demo</button>
            </div>
            <section class="bg-white dark:bg-gray-900">
                <div id="container-03" class="px-4 py-8 mx-auto max-w-md md:max-w-xl">
                    <div id="container-04" class="grid grid-cols-2 gap-4 md:grid-cols-4">
                        <img src="https://placehold.co/50" alt="Imagen 1" class="w-full h-auto rounded">
                        <img src="https://placehold.co/50" alt="Imagen 2" class="w-full h-auto rounded">
                        <img src="https://placehold.co/50" alt="Imagen 3" class="w-full h-auto rounded">
                        <img src="https://placehold.co/50" alt="Imagen 4" class="w-full h-auto rounded">
                    </div>
                </div>
            </section>
        </main>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
